name: Check Reactor Netty with Netty SNAPSHOTS

on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:

    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          transport: nio
          arch: arm64
          runner: windows-11-arm
          expander_leg: windows-2022--arm64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up JDK 1.8
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: 'zulu'
        java-version: '8'
          # Zulu 8 has no Windows arm64 build; use x64, which Windows 11 on ARM runs under emulation
        architecture: ${{ matrix.runner == 'windows-11-arm' && 'x64' || 
          matrix.arch }}
    - name: Set up JDK 11
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: 'zulu'
        java-version: '11'
          # use x64 on Windows 11 on ARM (emulated), consistent with the JDK 8 toolchain
        architecture: ${{ matrix.runner == 'windows-11-arm' && 'x64' || 
          matrix.arch }}
    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
      with:
        distribution: 'graalvm'
        java-version: '17.0.12'
          # GraalVM 17 has no Windows arm64 build; use x64, which Windows 11 on ARM runs under emulation
        architecture: ${{ matrix.runner == 'windows-11-arm' && 'x64' || 
          matrix.arch }}
    - name: Build and test with Java 8
      if: ${{ ! startsWith(matrix.transport, 'io_uring') }}
      run: ./gradlew clean check -x :reactor-netty-core:java17Test -x 
        :reactor-netty-core:java11Test --no-daemon -PforceTransport=${{ 
        matrix.transport }} -PforceNettyVersion='4.2.19.Final-SNAPSHOT' 
        -PparallelTests
    - name: Build and test IO_Uring on Java 11
      if: ${{ startsWith(matrix.transport, 'io_uring') }}
        # Add -PtestToolchain=11
      run: ./gradlew clean check -x :reactor-netty-core:test -x 
        :reactor-netty-core:java17Test -x :reactor-netty-core:shadedJarTest -x 
        :reactor-netty-graalvm-smoke-tests:test --no-daemon -PforceTransport=${{
        matrix.transport }} -PforceNettyVersion='4.2.19.Final-SNAPSHOT' 
        -PparallelTests
    - name: GraalVM smoke tests
      if: ${{ ! startsWith(matrix.transport, 'io_uring') }}
      run: ./gradlew :reactor-netty-graalvm-smoke-tests:nativeTest --no-daemon 
        -PforceTransport=${{ matrix.transport }} 
        -PforceNettyVersion='4.2.19.Final-SNAPSHOT'
    - name: GraalVM smoke tests IO_Uring on Java 17
      if: ${{ startsWith(matrix.transport, 'io_uring') }}
      run: ./gradlew :reactor-netty-graalvm-smoke-tests:nativeTest 
        -PtestToolchain=17 --no-daemon -PforceTransport=${{ matrix.transport }} 
        -PforceNettyVersion='4.2.19.Final-SNAPSHOT'
    name: build [${{ matrix.expander_leg }}]
    timeout-minutes: 150
